services:
  catalog:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-1}
