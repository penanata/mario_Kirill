<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1f8">
<meta name="description" content="Английские слова к уроку. Список хранится только на этом телефоне.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Слова</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #f6f1f8;
    --card: #fffcfe;
    --ink: #2c2433;
    --muted: #6f657c;
    --line: #e3d8ec;
    --lilac: #c9b6dc;
    --lilac-deep: #6d5a86;
    --lilac-soft: #f3eaf8;
    --tiffany: #81d8d0;
    --tiffany-deep: #2f6f69;
    --tiffany-ink: #143834;
    --tiffany-soft: #e7f6f4;
    --danger: #8a3d55;
    --danger-line: #f0d4dc;
    --shadow: 0 22px 50px rgba(92, 70, 120, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(900px 480px at 0% -10%, #efe4f7 0%, transparent 60%),
      radial-gradient(720px 420px at 100% 0%, #e5f6f4 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  :focus { outline: none; }
  :focus-visible {
    outline: 3px solid var(--tiffany);
    outline-offset: 2px;
  }
  #app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: calc(16px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  h2 { margin: 0 0 12px; font-size: 20px; font-weight: 650; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
  .top { margin: 8px 0 18px; }
  .notice {
    background: var(--lilac-soft);
    color: var(--lilac-deep);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 16px;
  }
  .study {
    min-height: calc(100dvh - 44px);
    display: flex;
    flex-direction: column;
  }
  .study-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 48px;
  }
  .link-list {
    min-height: 48px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #e0d3ea;
    background: rgba(255, 252, 254, 0.8);
    color: var(--lilac-deep);
    font-size: 16px;
    font-weight: 650;
  }
  .progress-wrap { text-align: right; }
  .progress {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--lilac-deep);
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding: 12px 0 8px;
  }
  .card {
    display: block;
    width: 100%;
    height: min(400px, 48dvh);
    perspective: 1200px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform: rotateY(0deg);
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.28s ease;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 56px;
    border-radius: 28px;
    border: 1px solid #e4d7ee;
    border-top: 4px solid var(--lilac);
    background: var(--card);
    box-shadow: var(--shadow);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    text-align: center;
    overflow: hidden;
  }
  .face.back {
    transform: rotateY(180deg);
    background: #f4fbfa;
    border-color: #d5efec;
    border-top-color: var(--tiffany);
  }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .word-text {
    font-size: clamp(30px, 8vw, 44px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .face.back .word-text { color: var(--tiffany-deep); }
  .face.back .word-text.missing,
  .missing { color: var(--muted); }
  .example {
    margin-top: 14px;
    font-size: 17px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .tap-hint {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 16px;
    font-size: 14px;
    color: var(--muted);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 56px;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid transparent;
    font-size: 18px;
    font-weight: 650;
    background: var(--card);
  }
  .btn.primary { background: var(--tiffany); color: var(--tiffany-ink); }
  .btn.secondary {
    background: var(--card);
    color: var(--lilac-deep);
    border-color: #e0d3ea;
  }
  .btn.return {
    background: var(--tiffany-soft);
    color: var(--tiffany-ink);
    border-color: #cfeae6;
  }
  .btn.danger { background: var(--card); color: var(--danger); border-color: var(--danger-line); }
  .btn:disabled { opacity: 0.4; }
  .btn:active { transform: translateY(1px); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quiet-note {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 18px;
  }
  .done, .empty {
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid #e4d7ee;
    border-top: 4px solid var(--lilac);
    border-radius: 28px;
    padding: 32px 22px;
    box-shadow: var(--shadow);
  }
  .done h2, .empty-title { margin: 0; font-size: 28px; }
  .done p, .empty-text { margin: 0 0 8px; color: var(--muted); max-width: 28ch; }
  .done .btn, .empty .btn { width: min(100%, 280px); }
  .return-bar {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 4px 0 12px;
    background: linear-gradient(#f6f1f8 75%, rgba(246, 241, 248, 0));
  }
  .words-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .word {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
  }
  .word.is-current { border-color: #b7e6e1; }
  .word-en {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }
  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--tiffany-soft);
    color: var(--tiffany-deep);
    font-size: 13px;
    font-weight: 600;
    vertical-align: 3px;
  }
  .word-ru { margin-top: 4px; font-size: 18px; overflow-wrap: anywhere; }
  .word-ex { margin-top: 6px; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
  .actions { margin-top: 14px; display: grid; gap: 10px; }
  .confirm-q { margin: 0; font-size: 16px; }
  section + section { margin-top: 28px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  label { font-size: 15px; color: var(--muted); }
  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 18px;
    line-height: 1.35;
    min-height: 56px;
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  textarea { min-height: 148px; resize: vertical; }
  .help { margin: 0 0 10px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .form-error { margin: 0 0 8px; color: var(--danger); font-size: 16px; }
  .form-error:empty { display: none; }
  .choice { margin-bottom: 16px; }
  .choice-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 15px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    min-height: 52px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    font-weight: 650;
  }
  .seg button[aria-pressed="true"] {
    background: var(--lilac-soft);
    border-color: var(--lilac);
    color: var(--lilac-deep);
  }
  .pool { margin: 8px 0 16px; color: var(--muted); }
  .reset { margin-top: 8px; }
  .noscript {
    max-width: 440px;
    margin: 24px auto;
    padding: 0 16px;
    font-family: system-ui, sans-serif;
  }
  @media (min-width: 900px) {
    #app {
      max-width: 680px;
      padding: 36px 28px 64px;
    }
    .study { min-height: calc(100dvh - 100px); }
    .card { height: 460px; }
    .word-text { font-size: 52px; }
    .stage { padding: 28px 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
<noscript><p class="noscript">Включите JavaScript в браузере. Слова хранятся только на этом телефоне.</p></noscript>
<div id="app"></div>
<script>
const KEY = 'slova-v1';

const STARTER = [
  ['up', 'вверх'],
  ['down', 'вниз'],
  ['over', 'через'],
  ['under', 'под'],
  ['into', 'внутрь'],
  ['out of', 'из'],
  ['onto', 'на поверхность'],
  ['off', 'с поверхности'],
  ['towards', 'по направлению к'],
  ['away from', 'прочь от'],
  ['across', 'поперёк'],
  ['along', 'вдоль'],
  ['around', 'вокруг'],
  ['past', 'мимо'],
  ['through', 'сквозь'],
  ['at', 'у'],
  ['on', 'на'],
  ['opposite', 'напротив'],
  ['to', 'к'],
  ['somehow', 'каким-то образом'],
  ['to have a lot on my plate', 'дел по горло'],
  ['to juggle it all', 'успевать всё сразу'],
  ['loans', 'кредиты'],
  ['to wear different hats', 'выполнять разные роли'],
  ['individual entrepreneurship', 'индивидуальное предпринимательство'],
  ['income', 'доход'],
  ['to influence / have an impact', 'влиять'],
  ['bridge', 'мост'],
  ['church', 'церковь'],
  ['crossing', 'переход'],
  ['crossroads', 'перекрёсток'],
  ['monument', 'памятник'],
  ['playground', 'детская площадка'],
  ['police station', 'полицейский участок'],
  ['roundabout', 'круговая развязка'],
  ['stadium', 'стадион'],
  ['subway', 'метро'],
  ['town hall', 'мэрия'],
  ['traffic lights', 'светофор'],
];

const state = load();
if (state.pendingSeedSave) {
  delete state.pendingSeedSave;
  save();
}
let view = 'study';
let editingId = null;
let pendingDeleteId = null;
let confirmReset = false;
let notice = '';
let focusId = null;
let session = null;
let renderedView = '';
let kept = null;

function wordKey(text) {
  return String(text || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function mergeStarter(words) {
  const seen = new Set(words.map((word) => wordKey(word.en)));
  for (const [en, ru] of STARTER) {
    const key = wordKey(en);
    if (seen.has(key)) continue;
    words.push({ id: uid(), en, ru, example: '', known: false });
    seen.add(key);
  }
}

function load() {
  let data = null;
  try {
    data = JSON.parse(localStorage.getItem(KEY) || 'null');
  } catch (err) {
    data = null;
  }
  const next = {
    words: data && Array.isArray(data.words) ? data.words.map(sanitizeWord).filter(Boolean) : [],
    direction: data && data.direction === 'ru-en' ? 'ru-en' : 'en-ru',
    mode: data && data.mode === 'all' ? 'all' : 'learning',
    pendingSeedSave: false,
  };
  if (!data || data.starterSeeded !== true) {
    mergeStarter(next.words);
    next.pendingSeedSave = true;
  }
  return next;
}

function sanitizeWord(word) {
  if (!word || typeof word.en !== 'string' || !word.en.trim()) return null;
  return {
    id: typeof word.id === 'string' && word.id ? word.id : uid(),
    en: word.en.trim(),
    ru: typeof word.ru === 'string' ? word.ru.trim() : '',
    example: typeof word.example === 'string' ? word.example.trim() : '',
    known: !!word.known,
  };
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      words: state.words,
      direction: state.direction,
      mode: state.mode,
      starterSeeded: true,
    }));
    return true;
  } catch (err) {
    notice = 'Не удалось сохранить на этом устройстве';
    return false;
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function parseLine(line) {
  const text = String(line || '').replace(/\u00a0/g, ' ').trim();
  if (!text) return null;
  const match = /\s*[—–]\s*|\s*:\s*|\s*\/\s*|\s+[-\u2212]\s+/.exec(text);
  if (!match) return { en: text, ru: '' };
  const en = text.slice(0, match.index).trim();
  const ru = text.slice(match.index + match[0].length).trim();
  if (!en) return null;
  return { en, ru };
}

function parseList(text) {
  const items = [];
  for (const line of String(text || '').split(/\r?\n/)) {
    const item = parseLine(line);
    if (item) items.push(item);
  }
  return items;
}

function ruCards(n) {
  const n10 = n % 10;
  const n100 = n % 100;
  let word = 'слов';
  if (n10 === 1 && n100 !== 11) word = 'слово';
  else if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) word = 'слова';
  return n + ' ' + word;
}

function currentPool() {
  if (state.mode === 'all') return state.words.slice();
  return state.words.filter((word) => !word.known);
}

function el(tag, attrs, kids) {
  const node = document.createElement(tag);
  const props = attrs || {};
  for (const key of Object.keys(props)) {
    const value = props[key];
    if (value == null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'value') node.value = value;
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else node.setAttribute(key, value === true ? '' : String(value));
  }
  if (tag === 'button' && !node.hasAttribute('type')) node.type = 'button';
  const list = kids == null ? [] : Array.isArray(kids) ? kids : [kids];
  for (const kid of list) {
    if (kid == null || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function openStudy() {
  view = 'study';
  editingId = null;
  pendingDeleteId = null;
  confirmReset = false;
  notice = '';
  render();
}

function openWords() {
  view = 'words';
  pendingDeleteId = null;
  confirmReset = false;
  notice = '';
  render();
}

function maybeNotice() {
  if (!notice) return null;
  return el('div', { class: 'notice', role: 'status', text: notice });
}

function captureDraft() {
  const one = document.getElementById('one-word');
  const many = document.getElementById('many-words');
  const edit = document.getElementById('edit-word');
  const active = document.activeElement;
  return {
    en: one ? one.en.value : '',
    ru: one ? one.ru.value : '',
    example: one ? one.example.value : '',
    list: many ? many.list.value : '',
    editEn: edit ? edit.en.value : null,
    editRu: edit ? edit.ru.value : null,
    editExample: edit ? edit.example.value : null,
    focus: active && active.id ? active.id : '',
  };
}

function beginSessionIfPossible() {
  if (session) return;
  const words = currentPool();
  if (!words.length) return;
  session = {
    ids: words.map((word) => word.id),
    total: words.length,
    done: 0,
    flipped: false,
  };
}

function dropMissingCards() {
  if (!session) return;
  session.ids = session.ids.filter((id) => state.words.some((word) => word.id === id));
}

function rememberInSession(id) {
  if (!session) return;
  session.ids.push(id);
  session.total += 1;
}

function render() {
  kept = captureDraft();
  if (view === 'words') renderWords();
  else renderStudy();
}

function renderStudy() {
  view = 'study';
  const viewChanged = renderedView !== 'study';
  renderedView = 'study';
  document.title = 'Слова';
  beginSessionIfPossible();
  dropMissingCards();
  const root = el('main', { class: 'page study', 'data-view': 'study' });
  const bar = el('div', { class: 'study-bar' });
  bar.append(el('button', {
    id: 'open-list',
    class: 'link-list',
    text: 'Список',
    onclick: openWords,
  }));
  if (session && session.total) bar.append(renderProgress());
  root.append(bar);
  const stage = el('div', { class: 'stage' });
  if (!state.words.length) {
    stage.append(el('div', { class: 'empty' }, [
      el('p', { class: 'empty-title', text: 'Пока нет слов' }),
      el('p', { class: 'empty-text', text: 'Откройте список и добавьте слова от преподавателя.' }),
      el('button', { class: 'btn return', text: 'Открыть список', onclick: openWords }),
    ]));
  } else if (session && session.ids.length) {
    const word = state.words.find((item) => item.id === session.ids[0]);
    if (word) {
      stage.append(renderCard(word));
      stage.append(el('div', { class: 'btn-row' }, [
        el('button', { id: 'again', class: 'btn secondary', text: 'Ещё раз', onclick: again }),
        el('button', { id: 'know', class: 'btn primary', text: 'Знаю', onclick: know }),
      ]));
    }
  } else if (session && !session.ids.length) {
    stage.append(renderDone());
  } else {
    stage.append(el('div', { class: 'empty' }, [
      el('p', { class: 'empty-title', text: 'На сегодня всё' }),
      el('p', { class: 'empty-text', text: 'Все слова уже с отметкой «знаю». В списке можно сбросить её или учить все.' }),
      el('button', { class: 'btn return', text: 'Открыть список', onclick: openWords }),
    ]));
  }
  root.append(stage);
  document.getElementById('app').replaceChildren(root);
  afterRender(viewChanged);
}

function renderWords() {
  const viewChanged = renderedView !== 'words';
  renderedView = 'words';
  document.title = 'Список — Слова';
  const root = el('main', { class: 'page words', 'data-view': 'words' });
  const bar = el('div', { class: 'return-bar' });
  bar.append(el('button', {
    id: 'back-to-card',
    class: 'btn return',
    text: 'К карточке',
    onclick: openStudy,
  }));
  root.append(bar);
  const known = state.words.filter((word) => word.known).length;
  const sub = state.words.length
    ? ruCards(state.words.length) + (known ? ' · знаю ' + known : '')
    : 'К уроку';
  root.append(renderHeader('Слова', sub));
  const note = maybeNotice();
  if (note) root.append(note);
  if (editingId) {
    root.append(renderEdit());
  } else {
    if (state.words.length) {
      const list = el('ul', { class: 'words-list' });
      for (const word of state.words) list.append(renderWord(word));
      root.append(list);
    } else {
      root.append(el('p', { class: 'pool', text: 'Пока нет слов. Добавьте первое ниже.' }));
    }
    root.append(renderAddForms());
    root.append(renderSettings());
  }
  document.getElementById('app').replaceChildren(root);
  afterRender(viewChanged);
}

function afterRender(viewChanged) {
  const focus = kept && kept.focus;
  if (viewChanged) window.scrollTo(0, 0);
  if (focusId) {
    const node = document.querySelector('[data-id="' + focusId + '"]');
    if (node) node.scrollIntoView({ block: 'center' });
    focusId = null;
  } else if (focus && document.getElementById(focus)) {
    const node = document.getElementById(focus);
    if (node.matches('input, textarea')) node.focus();
  }
}

function renderHeader(title, subtitle) {
  const header = el('header', { class: 'top' });
  header.append(el('h1', { text: title }));
  if (subtitle) header.append(el('p', { class: 'sub', text: subtitle }));
  return header;
}

function renderProgress() {
  const done = session.done;
  const total = session.total;
  const wrap = el('div', { class: 'progress-wrap' });
  wrap.append(el('p', {
    class: 'progress',
    text: done + '/' + total,
    'aria-label': 'Знаю ' + done + ' из ' + total,
  }));
  return wrap;
}

function renderDone() {
  const pool = currentPool();
  const actions = el('div', { class: 'actions' });
  if (pool.length) {
    actions.append(el('button', {
      class: 'btn primary',
      text: 'Ещё круг',
      onclick: () => { session = null; render(); },
    }));
  } else {
    actions.append(el('button', {
      class: 'btn primary',
      text: 'Повторить все',
      onclick: () => { state.mode = 'all'; session = null; save(); render(); },
    }));
  }
  actions.append(el('button', { class: 'btn return', text: 'Список', onclick: openWords }));
  return el('div', { class: 'done' }, [
    el('h2', { text: 'Готово' }),
    el('p', { text: 'В этом круге все карточки отмечены как «знаю».' }),
    actions,
  ]);
}

function renderWord(word) {
  const current = session && session.ids[0] === word.id;
  const item = el('li', {
    class: current ? 'word is-current' : 'word',
    'data-id': word.id,
    'data-en': word.en,
    'data-known': word.known ? '1' : '0',
  });
  const title = el('div', { class: 'word-en', lang: 'en' });
  title.append(document.createTextNode(word.en));
  if (word.known) title.append(el('span', { class: 'badge', text: 'знаю' }));
  item.append(title);
  item.append(el('div', {
    class: word.ru ? 'word-ru' : 'word-ru missing',
    text: word.ru || 'нет перевода',
  }));
  if (word.example) item.append(el('div', { class: 'word-ex', lang: 'en', text: word.example }));
  const actions = el('div', { class: 'actions' });
  if (pendingDeleteId === word.id) {
    actions.append(el('p', { class: 'confirm-q', text: 'Удалить это слово?' }));
    actions.append(el('div', { class: 'btn-row' }, [
      el('button', {
        class: 'btn secondary',
        text: 'Оставить',
        onclick: () => { pendingDeleteId = null; render(); },
      }),
      el('button', {
        class: 'btn danger',
        text: 'Удалить',
        onclick: () => removeWord(word.id),
      }),
    ]));
  } else {
    actions.append(el('div', { class: 'btn-row' }, [
      el('button', {
        class: 'btn secondary',
        text: 'Изменить',
        onclick: () => { editingId = word.id; render(); },
      }),
      el('button', {
        class: 'btn danger',
        text: 'Удалить',
        onclick: () => { pendingDeleteId = word.id; render(); },
      }),
    ]));
  }
  item.append(actions);
  return item;
}

function removeWord(id) {
  state.words = state.words.filter((word) => word.id !== id);
  if (session) session.ids = session.ids.filter((item) => item !== id);
  if (editingId === id) editingId = null;
  pendingDeleteId = null;
  notice = 'Слово удалено';
  save();
  view = 'words';
  render();
}

function renderAddForms() {
  const wrap = el('div');
  const one = el('section');
  one.append(el('h2', { text: 'Новое слово' }));
  const form = el('form', { id: 'one-word' });
  form.append(field('en', 'Английское слово', el('input', {
    id: 'en',
    name: 'en',
    type: 'text',
    autocomplete: 'off',
    autocapitalize: 'none',
    autocorrect: 'off',
    spellcheck: 'false',
    placeholder: 'apple',
    value: kept ? kept.en : '',
  })));
  form.append(field('ru', 'Перевод', el('input', {
    id: 'ru',
    name: 'ru',
    type: 'text',
    autocomplete: 'off',
    autocapitalize: 'off',
    placeholder: 'яблоко',
    value: kept ? kept.ru : '',
  })));
  form.append(field('example', 'Пример (необязательно)', el('input', {
    id: 'example',
    name: 'example',
    type: 'text',
    autocomplete: 'off',
    autocapitalize: 'sentences',
    placeholder: 'I eat an apple',
    value: kept ? kept.example : '',
  })));
  const oneError = el('p', { class: 'form-error', 'aria-live': 'polite' });
  form.append(oneError);
  form.append(el('button', { class: 'btn primary', type: 'submit', text: 'Добавить слово' }));
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const en = form.en.value.trim();
    const ru = form.ru.value.trim();
    const example = form.example.value.trim();
    if (!en) {
      oneError.textContent = 'Напишите английское слово';
      form.en.focus();
      return;
    }
    const id = uid();
    state.words.push({ id, en, ru, example, known: false });
    rememberInSession(id);
    save();
    form.en.value = '';
    form.ru.value = '';
    form.example.value = '';
    notice = 'Слово добавлено';
    focusId = id;
    view = 'words';
    render();
  });
  one.append(form);

  const many = el('section');
  many.append(el('h2', { text: 'Вставить список' }));
  many.append(el('p', {
    class: 'help',
    text: 'Одна строка — одно слово. Подойдут apple — яблоко, дефис, двоеточие и слэш. Пустые строки пропускаются. Если перевода нет, сохранится английское слово.',
  }));
  const paste = el('form', { id: 'many-words' });
  const area = el('textarea', {
    id: 'list',
    name: 'list',
    'aria-label': 'Список от преподавателя',
    value: kept ? kept.list : '',
  });
  area.placeholder = 'apple — яблоко\nbook - книга\ncat: кошка\ndog / собака';
  paste.append(area);
  const manyError = el('p', { class: 'form-error', 'aria-live': 'polite' });
  paste.append(manyError);
  paste.append(el('button', { class: 'btn primary', type: 'submit', text: 'Добавить список' }));
  paste.addEventListener('submit', (event) => {
    event.preventDefault();
    const items = parseList(area.value);
    if (!items.length) {
      manyError.textContent = 'Нет строк со словами';
      area.focus();
      return;
    }
    let lastId = null;
    for (const item of items) {
      lastId = uid();
      state.words.push({
        id: lastId,
        en: item.en,
        ru: item.ru,
        example: '',
        known: false,
      });
      rememberInSession(lastId);
    }
    save();
    area.value = '';
    notice = 'Добавлено ' + ruCards(items.length);
    focusId = lastId;
    view = 'words';
    render();
  });
  many.append(paste);
  wrap.append(one, many);
  return wrap;
}

function field(id, label, control) {
  return el('div', { class: 'field' }, [
    el('label', { for: id, text: label }),
    control,
  ]);
}

function renderEdit() {
  const word = state.words.find((item) => item.id === editingId);
  const wrap = el('div');
  wrap.append(renderHeader('Изменить', ''));
  if (!word) {
    wrap.append(el('p', { text: 'Слово не найдено' }));
    wrap.append(el('button', {
      class: 'btn secondary',
      text: 'К списку',
      onclick: () => { editingId = null; render(); },
    }));
    return wrap;
  }
  const form = el('form', { id: 'edit-word' });
  form.append(field('edit-en', 'Английское слово', el('input', {
    id: 'edit-en',
    name: 'en',
    type: 'text',
    autocomplete: 'off',
    autocapitalize: 'none',
    autocorrect: 'off',
    spellcheck: 'false',
    value: kept && kept.editEn != null ? kept.editEn : word.en,
  })));
  form.append(field('edit-ru', 'Перевод', el('input', {
    id: 'edit-ru',
    name: 'ru',
    type: 'text',
    value: kept && kept.editRu != null ? kept.editRu : word.ru,
    autocomplete: 'off',
    autocapitalize: 'off',
  })));
  form.append(field('edit-example', 'Пример (необязательно)', el('input', {
    id: 'edit-example',
    name: 'example',
    type: 'text',
    value: kept && kept.editExample != null ? kept.editExample : word.example,
    autocomplete: 'off',
  })));
  const error = el('p', { class: 'form-error', 'aria-live': 'polite' });
  form.append(error);
  form.append(el('div', { class: 'actions' }, [
    el('button', { class: 'btn primary', type: 'submit', text: 'Сохранить' }),
    el('button', {
      class: 'btn secondary',
      text: 'Назад к списку',
      onclick: () => { editingId = null; render(); },
    }),
  ]));
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const en = form.en.value.trim();
    if (!en) {
      error.textContent = 'Напишите английское слово';
      form.en.focus();
      return;
    }
    word.en = en;
    word.ru = form.ru.value.trim();
    word.example = form.example.value.trim();
    save();
    editingId = null;
    notice = 'Сохранено';
    focusId = word.id;
    view = 'words';
    render();
  });
  wrap.append(form);
  return wrap;
}

function renderSettings() {
  const wrap = el('section');
  wrap.append(el('h2', { text: 'Как учить' }));
  wrap.append(el('div', { class: 'choice' }, [
    el('span', { class: 'choice-label', text: 'Какие слова' }),
    el('div', { class: 'seg' }, [
      segButton('learning', 'Учу', state.mode === 'learning', () => setMode('learning')),
      segButton('all', 'Все', state.mode === 'all', () => setMode('all')),
    ]),
  ]));
  wrap.append(el('div', { class: 'choice' }, [
    el('span', { class: 'choice-label', text: 'Направление' }),
    el('div', { class: 'seg' }, [
      segButton('en-ru', 'EN → RU', state.direction === 'en-ru', () => setDirection('en-ru')),
      segButton('ru-en', 'RU → EN', state.direction === 'ru-en', () => setDirection('ru-en')),
    ]),
  ]));
  wrap.append(renderReset());
  return wrap;
}

function renderReset() {
  const knownCount = state.words.filter((word) => word.known).length;
  const reset = el('div', { class: 'reset' });
  if (confirmReset) {
    reset.append(el('p', { class: 'confirm-q', text: 'Снять отметку «знаю» у всех слов?' }));
    reset.append(el('div', { class: 'btn-row' }, [
      el('button', { class: 'btn secondary', text: 'Нет', onclick: () => { confirmReset = false; render(); } }),
      el('button', { class: 'btn danger', text: 'Сбросить', onclick: resetKnown }),
    ]));
  } else {
    reset.append(el('button', {
      class: 'btn secondary',
      text: 'Сбросить «знаю»',
      disabled: knownCount === 0,
      onclick: () => { confirmReset = true; render(); },
    }));
  }
  return reset;
}

function segButton(id, text, pressed, onclick) {
  return el('button', {
    text,
    'aria-pressed': pressed ? 'true' : 'false',
    onclick,
  });
}

function setMode(mode) {
  state.mode = mode;
  session = null;
  save();
  render();
}

function setDirection(direction) {
  state.direction = direction;
  if (session) session.flipped = false;
  save();
  render();
}

function resetKnown() {
  state.words.forEach((word) => { word.known = false; });
  confirmReset = false;
  session = null;
  save();
  notice = 'Отметки «знаю» сняты';
  render();
}

function cardSides(word) {
  if (state.direction === 'ru-en') {
    return {
      front: { kicker: 'русский', text: word.ru || 'нет перевода', missing: !word.ru, lang: 'ru' },
      back: { kicker: 'английский', text: word.en, missing: false, lang: 'en', example: word.example },
    };
  }
  return {
    front: { kicker: 'английский', text: word.en, missing: false, lang: 'en' },
    back: { kicker: 'перевод', text: word.ru || 'нет перевода', missing: !word.ru, lang: 'ru', example: word.example },
  };
}

function renderCard(word) {
  const sides = cardSides(word);
  const card = el('div', {
    class: session.flipped ? 'card flipped' : 'card',
    role: 'button',
    tabindex: '0',
    'aria-label': 'Нажмите, чтобы перевернуть карточку',
    onclick: onFlip,
    onkeydown: onFlip,
  });
  const inner = el('div', { class: 'card-inner' });
  inner.append(makeFace('front', sides.front, !session.flipped));
  inner.append(makeFace('back', sides.back, session.flipped));
  card.append(inner);
  return card;
}

function makeFace(kind, side, visible) {
  const face = el('div', { class: 'face ' + kind, 'aria-hidden': visible ? 'false' : 'true' });
  face.append(el('div', { class: 'kicker', text: side.kicker }));
  face.append(el('div', {
    class: side.missing ? 'word-text missing' : 'word-text',
    lang: side.lang,
    text: side.text,
  }));
  if (side.example) face.append(el('div', { class: 'example', lang: 'en', text: side.example }));
  face.append(el('div', {
    class: 'tap-hint',
    text: kind === 'front' ? 'Нажмите или пробел / Enter' : 'Нажмите, чтобы вернуть',
  }));
  return face;
}

function onFlip(event) {
  if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
  if (event.type === 'keydown') event.preventDefault();
  session.flipped = !session.flipped;
  const card = event.currentTarget;
  card.classList.toggle('flipped', session.flipped);
  card.querySelector('.front').setAttribute('aria-hidden', session.flipped ? 'true' : 'false');
  card.querySelector('.back').setAttribute('aria-hidden', session.flipped ? 'false' : 'true');
  card.setAttribute('aria-label', session.flipped
    ? 'Перевод открыт. Нажмите, чтобы вернуть.'
    : 'Нажмите, чтобы перевернуть карточку');
}

function know() {
  if (!session || !session.ids.length) return;
  const word = state.words.find((item) => item.id === session.ids[0]);
  if (word) word.known = true;
  session.ids.shift();
  session.done += 1;
  session.flipped = false;
  save();
  render();
}

function again() {
  if (!session || !session.ids.length) return;
  const id = session.ids.shift();
  session.ids.push(id);
  session.flipped = false;
  render();
}

document.addEventListener('keydown', (event) => {
  if (view !== 'study') return;
  if (event.repeat) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const target = event.target;
  if (target && target.closest && target.closest('input, textarea, select')) return;
  if (!session || !session.ids.length) return;
  if (event.key === 'ArrowRight') {
    event.preventDefault();
    know();
    return;
  }
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    again();
    return;
  }
  if (event.key !== ' ' && event.key !== 'Enter') return;
  if (target && target.closest && target.closest('button, .card')) return;
  event.preventDefault();
  const card = document.querySelector('.card');
  if (card) onFlip({ type: 'click', currentTarget: card });
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
