<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Каталог поставщика{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="/">Сорта и наличие</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Каталог</a>
      <a href="/import" {% if request.url.path == '/import' %}class="active"{% endif %}>Загрузить из Telegram</a>
      <a href="/help" {% if request.url.path == '/help' %}class="active"{% endif %}>Как пользоваться</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
